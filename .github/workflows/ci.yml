name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Site is built from site/ sources
        run: npm run site && git diff --exit-code -- public
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (wrangler dry run, never deploys)
        run: npm run build
